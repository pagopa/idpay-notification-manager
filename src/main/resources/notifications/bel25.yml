notification:
  manager:
    io:
      profiles:
        BEL25:
          ONBOARDING_OK:
            subject: "${SUBJECT_OK_BEL:Hai ottenuto il bonus!}"
            markdown: |-
              ${MARKDOWN_OK_CTA_BEL:---
              it:
                  cta_1: 
                      text: "Vai al bonus"
                      action: "ioit://idpay/initiative/%initiativeId%"
                  cta_2: 
                      text: "Dove puoi spenderlo?"
                      action: "iohandledlink://https://pari.pagopa.it/bonuselettrodomestici/lista-punti-vendita"
              en:
                  cta_1: 
                      text: "Go to the bonus page"
                      action: "ioit://idpay/initiative/%initiativeId%"
                  cta_2: 
                      text: "Where can you spend it?"
                      action: "iohandledlink://https://pari.pagopa.it/bonuselettrodomestici/lista-punti-vendita"
              ---}${MARKDOWN_DOUBLE_NEW_LINE:
            
              }${MARKDOWN_OK_BEL:Buone notizie! Hai ottenuto il %initiativeName% da %rewardAmount%€. Sarà valido **per i prossimi 15 giorni**.
        
              È disponibile ora nella sezione Portafoglio, dove troverai i dettagli dell'importo e la validità.
        
              **Cosa puoi fare ora?**
        
              Puoi usarlo per ottenere uno sconto del 30% sul prezzo d'acquisto di un elettrodomestico nuovo ad alta efficienza, fino ad un massimo di %rewardAmount%€.
        
              **Come fare?**
        
              Per avere più informazioni su come e dove usare il bonus, [leggi i dettagli](https://assistenza.ioapp.it/hc/it/articles/40429655391505-Come-e-dove-spendere-il-Bonus-Elettrodomestici).
        
              **Importante:** ricorda che puoi usare il bonus solo se hai un vecchio elettrodomestico da smaltire. Concorda con il venditore quando e come consegnarlo, ma non smaltirlo autonomamente in discarica.}
          ONBOARDING_OK_PARTIAL:
            subject: "${SUBJECT_OK_PARTIAL_BEL:Hai ottenuto il bonus!}"
            markdown: |-
              ${MARKDOWN_OK_CTA_BEL:---
              it:
                  cta_1: 
                      text: "Vai al bonus"
                      action: "ioit://idpay/initiative/%initiativeId%"
                  cta_2: 
                      text: "Dove puoi spenderlo?"
                      action: "iohandledlink://https://pari.pagopa.it/bonuselettrodomestici/lista-punti-vendita"
              en:
                  cta_1: 
                      text: "Go to the bonus page"
                      action: "ioit://idpay/initiative/%initiativeId%"
                  cta_2: 
                      text: "Where can you spend it?"
                      action: "iohandledlink://https://pari.pagopa.it/bonuselettrodomestici/lista-punti-vendita"
              ---}${MARKDOWN_DOUBLE_NEW_LINE:
              
              }${MARKDOWN_OK_PARTIAL_BEL:Dopo le verifiche con INPS, il tuo ISEE risulta difforme o diverso da quanto dichiarato. 
            
              Per questo motivo, non è possibile assegnarti il bonus da 200€ che avevi richiesto, ma hai ottenuto comunque il **bonus di 100€.** Sarà valido **per i prossimi 15 giorni**.
        
              Se ritieni che ci sia un errore, verifica il tuo ISEE direttamente con INPS.
        
              **Cosa puoi fare ora?**
        
              Puoi usarlo per ottenere uno sconto del 30% sul prezzo d'acquisto di un elettrodomestico nuovo ad alta efficienza, fino ad un massimo di 100€,
        
              **Come fare?**
        
              Per avere più informazioni su come e dove usare il bonus, [leggi i dettagli](https://assistenza.ioapp.it/hc/it/articles/40429655391505-Come-e-dove-spendere-il-Bonus-Elettrodomestici).
        
              **Importante:** ricorda che puoi usare il bonus solo se hai un vecchio elettrodomestico da smaltire. Concorda con il venditore quando e come consegnarlo, ma non smaltirlo autonomamente in discarica.}
          ONBOARDING_JOINED:
            subject: "${SUBJECT_JOINED_BEL:Il bonus è stato già richiesto}"
            markdown: |-
              ${MARKDOWN_JOINED_BEL:La tua richiesta per il Bonus Elettrodomestici non può essere elaborata. Un'altra persona che fa parte della tua famiglia ha già presentato richiesta.
              
              È possibile ottenere **un solo bonus per famiglia anagrafica.**
              
              Per avere più dettagli sui requisiti del bonus, [leggi come fare](https://assistenza.ioapp.it/hc/it/articles/38962008319761-Cos-%C3%A8-e-come-richiedere-il-Bonus-Elettrodomestici).}${MARKDOWN_DOUBLE_NEW_LINE:
              
              }
          ONBOARDING_KO_GENERIC:
            subject: "${SUBJECT_KO_GENERIC_BEL:Non è stato possibile assegnarti il bonus}"
            markdown: |-
              ${MARKDOWN_KO_GENERIC_BEL:Purtroppo la tua richiesta per il Bonus Elettrodomestici non è stata accettata.
              
              La verifica dei requisiti non è andata a buon fine a causa di problemi di comunicazione con gli enti competenti.
              
              **Hai dei dubbi?**
              
              Se pensi che ci sia stato un errore, segnalalo a %managedEntity%.}
          ONBOARDING_KO_INITIATIVE_ENDED:
            subject: "${SUBJECT_KO_THANKS_BEL:Bonus Elettrodomestici:tutti i fondi sono stati assegnati}"
            markdown: |-
              ${MARKDOWN_KO_THANKS_BEL:La tua richiesta era in lista d'attesa, ma **tutti i fondi disponibili sono stati assegnati**.
              Ci dispiace, ma purtroppo non è possibile assegnare il bonus.
              
              Grazie per aver mostrato interesse per il **Bonus Elettrodomestici**.
              
              Alla prossima iniziativa!}
          VOUCHER_EXPIRING:
            subject: "${SUBJECT_OK_REMINDER_BEL:Il tuo bonus sta per scadere!}"
            markdown: |-
              ${MARKDOWN_OK_CTA_BEL:---
              it:
                  cta_1: 
                      text: "Vai al bonus"
                      action: "ioit://idpay/initiative/%initiativeId%"
                  cta_2: 
                      text: "Dove puoi spenderlo?"
                      action: "iohandledlink://https://pari.pagopa.it/bonuselettrodomestici/lista-punti-vendita"
              en:
                  cta_1: 
                      text: "Go to the bonus page"
                      action: "ioit://idpay/initiative/%initiativeId%"
                  cta_2: 
                      text: "Where can you spend it?"
                      action: "iohandledlink://https://pari.pagopa.it/bonuselettrodomestici/lista-punti-vendita"
              ---}${MARKDOWN_DOUBLE_NEW_LINE:
        
              }${MARKDOWN_OK_REMINDER_BEL:Hai già deciso come usare il Bonus Elettrodomestici?
        
              Hai tempo **fino alle 23:59 del giorno %voucherEndDate%** per usare il contributo e sostituire un vecchio elettrodomestico con uno a basso consumo energetico.
        
              **Hai domande?**
        
              Per avere più dettagli su come e dove usare il bonus, [leggi la guida](https://assistenza.ioapp.it/hc/it/articles/40429655391505-Come-e-dove-spendere-il-Bonus-Elettrodomestici).}
          ONBOARDING_WAITING_LIST:
            subject: "${SUBJECT_ON_WAITING_LIST_BEL:Aggiornamenti sulla tua richiesta per %initiativeName%}"
            markdown: |-
              ${MARKDOWN_ON_WAITING_LIST_BEL:La tua richiesta per %initiativeName% è stata inserita in **lista d’attesa**, poiché al momento non ci sono fondi disponibili.
      
              **Cosa succede ora?**
      
              Non devi fare nulla: la tua richiesta rimane valida. Ti ricontatteremo se si renderanno disponibili nuove risorse.
      
              **Hai attivato le notifiche?**
              
              Se ancora non l’hai fatto, per non perderti i messaggi [attiva le notifiche push](#).
              
              **Come funziona il bonus?**
              
              Per saperne di più su come funziona il %initiativeName% e i criteri di assegnazione, [leggi i dettagli](https://assistenza.ioapp.it/hc/it/#categories).}